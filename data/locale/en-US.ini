# closed captions
Captions="Closed Captions"
Captions.Enable="Capture closed captions"
Captions.Channel="Caption channel"
Captions.Input="Caption input"
Captions.Input.Vbi="Raw VBI signal, decoded by this plugin (recommended)"
Captions.Input.CcPin="CC pin, decoded by the capture device"
Captions.Input.ToolTip="Raw VBI: the plugin reads the line 21 waveform itself, like a TV does. Most reliable.\nCC pin: uses the capture chip's own caption decoder, which can miss letters on VHS tapes.\nIf the device has no VBI pin, the CC pin is used automatically."
Captions.File="Write captions to text file"
Captions.FileMode="Text file contents"
Captions.FileMode.Current="Current caption only (replaced as it changes)"
Captions.FileMode.Append="Transcript (each finished caption line is added to the end)"
Captions.FileMode.ToolTip="Current caption: the file always holds exactly what a TV would be showing, and is empty when no caption is on screen.\nTranscript: every caption line is added to the end of the file once it's complete (when a pop-on caption appears, or a roll-up line scrolls up). Works with the Text source's Chatlog Mode."
Captions.TextSource="Also update this text source directly (instant)"
Captions.TextSource.None="(none)"
Captions.TextSource.ToolTip="Optional. Shows the current caption in the chosen Text source the moment it changes.\nA Text source reading a file only checks it about once a second, so this is noticeably faster.\nIf your text source isn't listed, create it first, then reopen these properties."
Captions.ClearSeconds="Clear captions after no caption data for"
Captions.ClearSeconds.ToolTip="Like a TV, clear the captions if no caption data has arrived for this many seconds.\n0 = never clear automatically."
Captions.LogRaw="Troubleshooting: log raw caption data and save a raw VBI sample"
