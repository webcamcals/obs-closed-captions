# closed captions
Captions="Closed Captions"
Captions.Enable="Capture closed captions"
Captions.Input="Caption input"
Captions.Input.Vbi="Raw VBI signal, decoded by this plugin (recommended)"
Captions.Input.CcPin="CC pin, decoded by the capture device"
Captions.Input.ToolTip="Raw VBI: the plugin reads the line 21 waveform itself, like a TV does. Most reliable.\nCC pin: uses the capture chip's own caption decoder, which can miss letters on VHS tapes.\nIf the device has no VBI pin, the CC pin is used automatically."
Captions.Channel="Caption channel"
Captions.TextSource="Text source for closed captions"
Captions.TextSource.None="(none)"
Captions.TextSource.ToolTip="Text source will be updated with current on-screen closed caption text the moment it changes. Empty when there are no captions currently on-screen."
Captions.ClearSeconds="Clear captions after no caption data for"
Captions.ClearSeconds.ToolTip="Like a TV, clear the captions if no caption data has arrived for this many seconds.\n0 = never clear automatically."
Captions.File="Write captions to text file"
Captions.FilePath="File"
Captions.FileMode="Text file contents"
Captions.FileMode.Overwrite="Overwrite"
Captions.FileMode.Append="Append"
Captions.FileMode.ToolTip="Overwrite: the file contains only what a TV would be showing, and is empty when there are no captions on screen.\n\nAppend: Add each new caption to the bottom row of a text file. Enable Chatlog Mode in OBS Text source to display multiple lines.\nNote that OBS only checks text files in Text Sources for updates about once a second, so the direct method (above) is preferred for stream layouts."
Captions.LogRaw="Troubleshooting: log raw caption data"
Captions.LogRaw.ToolTip="Writes every caption byte to the OBS log, and saves a short recording of the raw VBI signal to the plugin's settings folder. Only needed when reporting a problem."
